services:
  pipeline:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_PATH=/app/docs/sample-data
      - WAREHOUSE_PATH=/app/warehouse/settlement.duckdb
      - LOG_LEVEL=INFO
      - ENVIRONMENT=local
    volumes:
      - ./docs/sample-data:/app/docs/sample-data:ro
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./pipeline:/app/pipeline
      - ./dbt_project:/app/dbt_project
      - warehouse:/app/warehouse
    ports:
      - "8080:8080"
    command: tail -f /dev/null

  bi:
    image: node:20-slim
    profiles: ["bi"]
    working_dir: /app
    volumes:
      - ./evidence:/app
      - warehouse:/app/sources/settlement/data:ro
    ports:
      - "3000:3000"
    command: sh -c "until npm install --legacy-peer-deps --fetch-retries 5 --fetch-retry-maxtimeout 120000; do echo retrying npm install; sleep 5; done && npm run sources && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  warehouse:
