version: 2

sources:
  - name: settlement_db
    description: >
      CDC extracts (DMS-style, columns Op/_timestamp) from the operational
      PostgreSQL, delivered as parquet files on the local filesystem.
    meta:
      external_location: "{{ env_var('DATA_PATH', '/app/docs/sample-data') }}/{name}.parquet"
    tables:
      - name: transactions
        description: Two CDC batches with schema drift (batch 2 adds payment_method).
        meta:
          external_location: "read_parquet('{{ env_var('DATA_PATH', '/app/docs/sample-data') }}/transactions_batch_*.parquet', union_by_name=true)"
      - name: reconciliation_runs
      - name: reconciliation_results
      - name: enterprise_company

  - name: paysettler
    description: Daily settlement file from the external processor.
    tables:
      - name: settlement_file
        description: >
          Read with all_varchar so schema inference cannot flip column types
          depending on file contents (amounts arrive both as plain numbers
          and as 'R$ 1.234,56' strings); typing happens in staging.
        meta:
          external_location: "read_csv('{{ env_var('DATA_PATH', '/app/docs/sample-data') }}/settlement_paysettler.csv', header=true, all_varchar=true)"
